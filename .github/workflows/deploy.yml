name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 🔔 배포 성공 알림
  notify-slack-success:
    name: Notify Slack on Success
    needs: [build, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack success notification
        env:
          WEBHOOK_URL: ${{ secrets.QUARTZ_BLOG_STATUS }}
        run: |
          siteUrl="https://blog.elsom.co.kr"
          commitUrl="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg commitUrl "$commitUrl" \
            --arg siteUrl "$siteUrl" \
            '{
              blocks: [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "✅ 블로그가 정상 발행되었습니다" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*저장소*: \($repo)\n*브랜치*: \($branch)\n*커밋*: <\($commitUrl)|\($commit)>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🌐 블로그 열기" },
                      "url": $siteUrl
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🔍 커밋 보기" },
                      "url": $commitUrl
                    }
                  ]
                }
              ]
            }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$WEBHOOK_URL"

  # 🔥 배포 실패 알림
  notify-slack-failure:
    name: Notify Slack on Failure
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack failure notification
        env:
          WEBHOOK_URL: ${{ secrets.QUARTZ_BLOG_STATUS }}
        run: |
          siteUrl="https://blog.elsom.co.kr"
          workflowUrl="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg workflowUrl "$workflowUrl" \
            --arg siteUrl "$siteUrl" \
            '{
              blocks: [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🚨 블로그 등록이 실패했어요" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*저장소*: \($repo)\n*브랜치*: \($branch)"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "⚠️ 실패 로그 보기" },
                      "url": $workflowUrl
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🌐 블로그 열기" },
                      "url": $siteUrl
                    }
                  ]
                }
              ]
            }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$WEBHOOK_URL"
